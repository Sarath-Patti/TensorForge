[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorforge"
version = "1.0.0"
description = "A memory-aware deep learning framework and inference engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "TensorForge Contributors" }
]
keywords = ["deep-learning", "tensors", "inference", "machine-learning", "memory-aware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pybind11>=2.10.0",
]
native = [
    "pybind11>=2.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tensorforge*"]
